services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: al_ahmadi
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: al_ahmadi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U al_ahmadi -d al_ahmadi"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}",
      ]
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  api:
    image: "ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/${GHCR_REPOSITORY:-al-ahmadi-real-estate}-api:${APP_IMAGE_TAG:-latest}"
    init: true
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: "postgresql://al_ahmadi:${POSTGRES_PASSWORD}@db:5432/al_ahmadi"
      DIRECT_URL: "postgresql://al_ahmadi:${POSTGRES_PASSWORD}@db:5432/al_ahmadi"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      CORS_ORIGIN: "https://${DOMAIN:?Set DOMAIN in .env}"
      WEB_BASE_URL: "https://${DOMAIN:?Set DOMAIN in .env}"
      RESEND_API_KEY: "${RESEND_API_KEY:?Set RESEND_API_KEY in .env}"
      EMAIL_FROM: "${EMAIL_FROM:?Set EMAIL_FROM in .env}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env}"
      WEB_REVALIDATION_URL: http://web:3000/api/revalidate
      WEB_REVALIDATION_SECRET: "${WEB_REVALIDATION_SECRET:?Set WEB_REVALIDATION_SECRET in .env}"
      CLOUDINARY_CLOUD_NAME: "${CLOUDINARY_CLOUD_NAME:?Set Cloudinary credentials in .env}"
      CLOUDINARY_API_KEY: "${CLOUDINARY_API_KEY:?Set Cloudinary credentials in .env}"
      CLOUDINARY_API_SECRET: "${CLOUDINARY_API_SECRET:?Set Cloudinary credentials in .env}"
      MEDIA_MAX_IMAGE_BYTES: "${MEDIA_MAX_IMAGE_BYTES:-10485760}"
      MEDIA_MAX_IMAGE_PIXELS: "${MEDIA_MAX_IMAGE_PIXELS:-40000000}"
      MEDIA_MAX_PER_LISTING: "${MEDIA_MAX_PER_LISTING:-20}"
      ACCESS_TOKEN_TTL_SECONDS: "${ACCESS_TOKEN_TTL_SECONDS:-900}"
      REFRESH_TOKEN_TTL_DAYS: "${REFRESH_TOKEN_TTL_DAYS:-30}"
      TRUST_PROXY_HOPS: "1"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  web:
    image: "ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/${GHCR_REPOSITORY:-al-ahmadi-real-estate}-web:${APP_IMAGE_TAG:-latest}"
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ""
      API_INTERNAL_BASE_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: "https://${DOMAIN:?Set DOMAIN in .env}"
      BROKER_LICENSE_NUMBER: "${BROKER_LICENSE_NUMBER:-}"
      WEB_REVALIDATION_SECRET: "${WEB_REVALIDATION_SECRET:?Set WEB_REVALIDATION_SECRET in .env}"
    networks:
      - backend
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/en').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    security_opt:
      - no-new-privileges:true

  proxy:
    image: nginx:1.29-alpine
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN in .env}"
      NGINX_ENVSUBST_FILTER: "^(DOMAIN)$"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - "${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro"
    networks:
      - backend
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  seed:
    image: "ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER}/${GHCR_REPOSITORY:-al-ahmadi-real-estate}-api:${APP_IMAGE_TAG:-latest}"
    profiles: ["init"]
    command: ["pnpm", "--filter", "@al-ahmadi/api", "db:seed"]
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://al_ahmadi:${POSTGRES_PASSWORD}@db:5432/al_ahmadi"
      DIRECT_URL: "postgresql://al_ahmadi:${POSTGRES_PASSWORD}@db:5432/al_ahmadi"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
